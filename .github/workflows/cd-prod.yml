name: CD Prod

on:
    workflow_dispatch:

concurrency:
    group: deploy-prod
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    promote:
        runs-on: ubuntu-24.04
        environment:
            name: production
            url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/prod/
        steps:
            - name: Checkout the published site
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  ref: gh-pages

            - name: Fail if staging has never been deployed
              run: test -d staging || { echo '✗ staging/ not found on gh-pages — run CD Staging first.'; exit 1; }

            - name: Copy staging as the new prod
              run: cp -r staging promoted

            - name: Publish to gh-pages under prod/
              uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./promoted
                  destination_dir: prod
                  commit_message: 'deploy(prod): promote staging'
