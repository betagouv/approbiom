<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grist Custom Widgets</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 600px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      li {
        margin: 0.5rem 0;
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      button {
        font-size: 0.8rem;
        padding: 0.2rem 0.6rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #f5f5f5;
        cursor: pointer;
      }
      button:active {
        background: #e0e0e0;
      }
      button.copied {
        color: green;
        border-color: green;
      }
    </style>
  </head>
  <body>
    <h1>Grist Custom Widgets</h1>
    <ul>
      <li>
        <a href="./grist-widget/carte-departement/">Carte Département</a>
        <button onclick="copyLink(this)">Copier le lien</button>
      </li>
      <li>
        <a href="./grist-widget/widget-two/">Widget Two</a>
        <button onclick="copyLink(this)">Copier le lien</button>
      </li>
      <li>
        <a href="./grist-widget/vue-tableau/">Vue Tableau</a>
        <button onclick="copyLink(this)">Copier le lien</button>
      </li>
      <li>
        <a href="./grist-widget/liste-deroulante-riche-selecteur/">Liste déroulante riche sélecteur</a>
        <button onclick="copyLink(this)">Copier le lien</button>
      </li>
      <li>
        <a href="./grist-widget/barre-de-recherche/">Barre de recherche</a>
        <button onclick="copyLink(this)">Copier le lien</button>
      </li>
    </ul>
    <script>
      function copyLink(btn) {
        const a = btn.previousElementSibling;
        navigator.clipboard.writeText(new URL(a.href, location.href).href);
        btn.textContent = "Copié !";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = "Copier le lien";
          btn.classList.remove("copied");
        }, 2000);
      }
    </script>
  </body>
</html>
