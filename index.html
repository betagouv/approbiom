<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Approbiom - Liste des widgets Grist</title>
        <style>
            body {
                font-family:
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    Roboto,
                    sans-serif;
                max-width: 40rem;
                margin: 3rem auto;
                padding: 0 1.5rem;
                color: #161616;
            }
            h1 {
                font-size: 1.5rem;
            }
            p {
                color: #666;
            }
            ul {
                list-style: none;
                padding: 0;
            }
            li {
                margin: 0.5rem 0;
            }
            a {
                display: block;
                padding: 0.75rem 1rem;
                border: 1px solid #ddd;
                border-radius: 4px;
                color: #000091;
                text-decoration: none;
            }
            a:hover {
                border-color: #000091;
                background: #f5f5fe;
            }
            button {
                display: block;
                width: 100%;
                padding: 0.75rem 1rem;
                border: none;
                border-radius: 4px;
                font: inherit;
                text-align: left;
                color: #fff;
                background: #000091;
                cursor: pointer;
            }
            button:hover {
                background: #1212ff;
            }
            .toast {
                /* left and top are set in JS, next to the cursor. */
                position: fixed;
                white-space: nowrap;
                padding: 0.5rem 1rem;
                border-radius: 4px;
                color: #fff;
                background: #161616;
                opacity: 0;
                transition: opacity 0.2s;
                pointer-events: none;
            }
            .toast.visible {
                opacity: 1;
            }
        </style>
    </head>
    <body>
        <h1>Approbiom — widgets Grist</h1>
        <p>
            Ouvrez un widget pour le tester, ou copiez son URL dans le champ «
            Custom URL » d'un widget personnalisé Grist.
        </p>
        <ul>
            <li>
                <button onclick="copyWidgetUrl('accueil', event)">
                    Accueil
                </button>
            </li>
            <li>
                <button onclick="copyWidgetUrl('ressource', event)">
                    Ressource
                </button>
            </li>
            <li>
                <button onclick="copyWidgetUrl('concurrence', event)">
                    Concurrence
                </button>
            </li>
            <li>
                <button onclick="copyWidgetUrl('import', event)">Import</button>
            </li>
            <li>
                <button onclick="copyWidgetUrl('import-ademe', event)">
                    Import Ademe
                </button>
            </li>
            <li>
                <a href="./playground/"
                    >Playground pour les devs - composants partagés, hors
                    Grist</a
                >
            </li>
        </ul>

        <div id="toast" class="toast" role="status"></div>
        <script>
            let toastTimeout

            function showToast(message, x, y) {
                const toast = document.getElementById('toast')
                toast.textContent = message

                // Just below and to the right of (x, y), kept inside the window.
                const offset = 12
                const maxLeft = window.innerWidth - toast.offsetWidth - offset
                const maxTop = window.innerHeight - toast.offsetHeight - offset
                toast.style.left = Math.min(x + offset, maxLeft) + 'px'
                toast.style.top = Math.min(y + offset, maxTop) + 'px'
                toast.classList.add('visible')

                // Restart the timer if the user clicks again while it's shown.
                clearTimeout(toastTimeout)
                toastTimeout = setTimeout(
                    () => toast.classList.remove('visible'),
                    2000
                )
            }

            function copyWidgetUrl(nomWidget, event) {
                const widgetUrl = new URL(`./${nomWidget}/`, location.href).href

                const button = event.currentTarget
                const label = button.textContent.trim()

                const { left, bottom } = button.getBoundingClientRect()
                const fromKeyboard = event.detail === 0
                const x = fromKeyboard ? left : event.clientX
                const y = fromKeyboard ? bottom : event.clientY

                navigator.clipboard
                    .writeText(widgetUrl)
                    .then(() =>
                        showToast(`Url du widget « ${label} » copié !`, x, y)
                    )
            }
        </script>
    </body>
</html>
