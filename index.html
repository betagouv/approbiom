<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Approbiom — widgets Grist</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        max-width: 40rem;
        margin: 3rem auto;
        padding: 0 1.5rem;
        color: #161616;
      }
      h1 {
        font-size: 1.5rem;
      }
      p {
        color: #666;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        margin: 0.5rem 0;
      }
      a {
        display: block;
        padding: 0.75rem 1rem;
        border: 1px solid #ddd;
        border-radius: 4px;
        color: #000091;
        text-decoration: none;
      }
      a:hover {
        border-color: #000091;
        background: #f5f5fe;
      }
    </style>
  </head>
  <body>
    <h1>Approbiom — widgets Grist</h1>
    <p>
      Ouvrez un widget pour le tester, ou copiez son URL dans le champ « Custom
      URL » d'un widget personnalisé Grist.
    </p>
    <ul>
      <li><a href="./widget-a/">Widget A</a></li>
      <li><a href="./widget-b/">Widget B</a></li>
    </ul>
  </body>
</html>
